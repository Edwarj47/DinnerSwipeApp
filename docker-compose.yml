services:
  dinner-swipe-postgres:
    image: postgres:16
    container_name: dinner-swipe-postgres
    environment:
      POSTGRES_DB: dinner_swipe
      POSTGRES_USER: dinner_swipe_app
      POSTGRES_PASSWORD: ${DINNER_SWIPE_POSTGRES_PASSWORD:-change-me-dev-only}
    volumes:
      - dinner_swipe_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dinner_swipe_app -d dinner_swipe"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    profiles: ["development", "production"]

  dinner-swipe-api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    container_name: dinner-swipe-api
    env_file:
      - .env
      - path: .env.fatsecret
        required: false
    environment:
      DATABASE_URL: ${DINNER_SWIPE_RUNTIME_DATABASE_URL:?Configure the least-privilege runtime database URL before deployment}
      MIGRATION_DATABASE_URL: ""
      DINNER_SWIPE_POSTGRES_PASSWORD: ""
      DINNER_SWIPE_RUNTIME_DB_PASSWORD: ""
      FORWARDED_ALLOW_IPS: ${DINNER_SWIPE_TRUSTED_PROXY_IPS:?Configure exact trusted reverse-proxy addresses before deployment}
      IMAGE_STORAGE_PATH: /app/media
    depends_on:
      dinner-swipe-postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8108:8000"
    volumes:
      - dinner_swipe_media:/app/media
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 768m
    cpus: 2.0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    profiles: ["development", "production"]

  dinner-swipe-worker:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    container_name: dinner-swipe-worker
    command: ["python", "-m", "app.workers.runner"]
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DINNER_SWIPE_RUNTIME_DATABASE_URL:?Configure the least-privilege runtime database URL before deployment}
      MIGRATION_DATABASE_URL: ""
      DINNER_SWIPE_POSTGRES_PASSWORD: ""
      DINNER_SWIPE_RUNTIME_DB_PASSWORD: ""
      IMAGE_STORAGE_PATH: /app/media
    depends_on:
      dinner-swipe-postgres:
        condition: service_healthy
    volumes:
      - dinner_swipe_media:/app/media
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.5
    restart: unless-stopped
    profiles: ["production"]

  dinner-swipe-web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
    container_name: dinner-swipe-web
    ports:
      - "127.0.0.1:8109:8080"
    depends_on:
      dinner-swipe-api:
        condition: service_healthy
    volumes:
      - ./backups/android-public:/usr/share/nginx/html/downloads:ro
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 32
    mem_limit: 96m
    cpus: 0.5
    restart: unless-stopped
    profiles: ["production"]

volumes:
  dinner_swipe_postgres_data:
  dinner_swipe_media:
