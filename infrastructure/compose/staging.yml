name: dinner-swipe-staging
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: dinner_swipe_staging
      POSTGRES_USER: dinner_swipe_staging_owner
      POSTGRES_PASSWORD: ${DINNER_STAGING_POSTGRES_PASSWORD:?Set a private staging owner password}
      DINNER_STAGING_RUNTIME_PASSWORD: ${DINNER_STAGING_RUNTIME_PASSWORD:?Set a distinct staging runtime password}
    volumes:
      - database:/var/lib/postgresql/data
      - ../docker/staging-init.sh:/docker-entrypoint-initdb.d/10-runtime.sh:ro
    healthcheck:
      test: [CMD-SHELL, pg_isready -U dinner_swipe_staging_owner -d dinner_swipe_staging]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 512m
    cpus: 1
    networks: [private]
  migrate:
    image: ${DINNER_API_IMAGE:?Supply a verified API image digest}
    env_file: ${DINNER_STAGING_ENV_FILE:?Supply the private staging environment path}
    environment:
      DATABASE_URL: ${DINNER_STAGING_MIGRATION_URL:?Supply a staging-only owner URL}
      MIGRATION_DATABASE_URL: ${DINNER_STAGING_MIGRATION_URL:?Supply a staging-only owner URL}
    command: [alembic, upgrade, head]
    profiles: [bootstrap]
    networks: [private]
  api:
    image: ${DINNER_API_IMAGE:?Supply a verified API image digest}
    env_file: ${DINNER_STAGING_ENV_FILE:?Supply the private staging environment path}
    environment:
      DATABASE_URL: ${DINNER_STAGING_RUNTIME_URL:?Supply a staging-only runtime URL}
      MIGRATION_DATABASE_URL: ""
      DINNER_STAGING_POSTGRES_PASSWORD: ""
      DINNER_STAGING_RUNTIME_PASSWORD: ""
      DINNER_STAGING_MIGRATION_URL: ""
      IMAGE_STORAGE_PATH: /app/media
      FORWARDED_ALLOW_IPS: ""
    read_only: true
    tmpfs: [/tmp:size=64m,mode=1777]
    volumes: [media:/app/media]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 768m
    cpus: 1
    networks: [private]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready').read()"]
      interval: 10s
      timeout: 5s
      retries: 12
  web:
    image: ${DINNER_WEB_IMAGE:?Supply a verified web image digest}
    ports: ["127.0.0.1:${DINNER_STAGING_PORT:?Choose an unused loopback port}:8080"]
    volumes: [../docker/nginx-staging.conf:/etc/nginx/conf.d/default.conf:ro]
    read_only: true
    tmpfs: [/tmp:size=64m,mode=1777]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 96m
    cpus: 0.5
    networks: [private]
networks:
  private:
    internal: true
volumes:
  database:
  media:
