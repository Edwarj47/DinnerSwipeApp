server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; media-src 'self' blob:; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header X-Frame-Options "DENY" always;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~ ^/downloads/dinner-swipe-preview-[0-9]+\.apk(?:\.sha256)?$ {
    autoindex off;
    types {
      application/vnd.android.package-archive apk;
      text/plain sha256;
    }
    default_type application/octet-stream;
    try_files $uri =404;
  }

  location /downloads/ {
    return 404;
  }

  location /healthz {
    access_log off;
    return 200 "ok\n";
  }
}

