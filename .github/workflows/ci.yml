name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install -U pip
      - run: pip install -e "apps/api[dev]"
      - name: Check backend dependency resolution
        run: |
          python -m pip check
          python -m pip show SQLAlchemy mypy pydantic
      - run: cd apps/api && ruff check app
      - run: cd apps/api && mypy app
      - name: Run backend tests
        run: cd apps/api && pytest --junitxml="$RUNNER_TEMP/backend-tests.xml"
      - name: Annotate backend test failures
        if: failure()
        env:
          TEST_RESULTS: ${{ runner.temp }}/backend-tests.xml
        run: |
          python <<'PY'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET

          path = Path(os.environ["TEST_RESULTS"])
          if path.exists():
              for case in ET.parse(path).iter("testcase"):
                  for failure in list(case):
                      if failure.tag not in {"failure", "error"}:
                          continue
                      message = f"{case.get('classname')}.{case.get('name')}\n{failure.text or failure.get('message', '')}"
                      if len(message) > 6000:
                          message = message[:3000] + "\n...\n" + message[-3000:]
                      message = message.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                      print(f"::error title=Backend test failure::{message}")
          PY

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint -w apps/mobile
      - run: npm run typecheck -w apps/mobile
      - run: npm run test:icons -w apps/mobile
      - run: npm run test:release -w apps/mobile
      - name: Check native runtime contract
        run: node infrastructure/scripts/check-ota-runtime.cjs
      - name: Run mobile tests with a cold transform cache
        run: npm test -w apps/mobile -- --runInBand --no-cache --testTimeout=15000 --forceExit --json --outputFile="$RUNNER_TEMP/mobile-tests.json"
      - name: Annotate mobile test failures
        if: failure()
        env:
          TEST_RESULTS: ${{ runner.temp }}/mobile-tests.json
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          if (!fs.existsSync(process.env.TEST_RESULTS)) process.exit(0);
          const results = JSON.parse(fs.readFileSync(process.env.TEST_RESULTS, 'utf8'));
          const escape = value => value.replace(/%/g, '%25').replace(/\r/g, '%0D').replace(/\n/g, '%0A');
          for (const suite of results.testResults) {
            if (suite.status !== 'failed') continue;
            const failures = suite.assertionResults.filter(test => test.status === 'failed');
            const messages = failures.length ? failures.map(test => `${test.fullName}\n${test.failureMessages.join('\n')}`) : [suite.message];
            for (const message of messages) {
              const bounded = message.length > 6000 ? `${message.slice(0, 3000)}\n...\n${message.slice(-3000)}` : message;
              console.log(`::error title=Mobile test failure::${escape(bounded)}`);
            }
          }
          NODE
      - run: npm run build:web -w apps/mobile

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker compose --profile production build
        env:
          DINNER_SWIPE_RUNTIME_DATABASE_URL: postgresql+psycopg://dinner_swipe_runtime:ci-placeholder@dinner-swipe-postgres:5432/dinner_swipe
          DINNER_SWIPE_TRUSTED_PROXY_IPS: 127.0.0.1

  release-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: node --test infrastructure/tests/*.test.cjs

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci_owner
          POSTGRES_PASSWORD: ci_disposable_only
          POSTGRES_DB: postgres
        ports:
          - 15413:5432
          - 15414:5432
        options: --health-cmd "pg_isready -U ci_owner" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install -e "apps/api[dev]"
      - name: Provision disposable databases
        run: |
          python <<'PY'
          import psycopg
          from psycopg import sql
          with psycopg.connect(host="127.0.0.1",port=15413,user="ci_owner",password="ci_disposable_only",dbname="postgres",autocommit=True) as db:
              for name in ("migration_test","security_test","offline_test","workout_test","calculator_test"):
                  db.execute(sql.SQL("CREATE DATABASE {}").format(sql.Identifier(name)))
          PY
      - name: Verify real migration upgrades and rollback
        working-directory: apps/api
        env:
          CI_MIGRATION_DATABASE_URL: postgresql+psycopg://ci_owner:ci_disposable_only@127.0.0.1:15413/migration_test
          DATABASE_URL: "sqlite:///:memory:"
          JWT_SECRET: disposable-ci-secret-not-a-production-secret
        run: PYTHONPATH=. python ../../infrastructure/scripts/verify-postgres-migrations.py
      - name: Run PostgreSQL concurrency and permission regressions
        working-directory: apps/api
        env:
          SECURITY_TEST_DATABASE_URL: postgresql+psycopg://ci_owner:ci_disposable_only@127.0.0.1:15413/security_test
          OFFLINE_TEST_DATABASE_URL: postgresql+psycopg://ci_owner:ci_disposable_only@127.0.0.1:15413/offline_test
          WORKOUT_TEST_DATABASE_URL: postgresql+psycopg://ci_owner:ci_disposable_only@127.0.0.1:15413/workout_test
          CALCULATOR_TEST_DATABASE_URL: postgresql+psycopg://ci_owner:ci_disposable_only@127.0.0.1:15414/calculator_test
        run: pytest app/tests/*postgres.py --junitxml=postgres-results.xml
      - name: Verify the isolated staging runtime role
        working-directory: apps/api
        env:
          CI_STAGING_ADMIN_URL: postgresql+psycopg://ci_owner:ci_disposable_only@127.0.0.1:15413/postgres
          CI_STAGING_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          DATABASE_URL: "sqlite:///:memory:"
          JWT_SECRET: disposable-ci-secret-not-a-production-secret
        run: PYTHONPATH=. python ../../infrastructure/scripts/verify-staging-roles.py
      - name: Require integration coverage instead of skipped tests
        working-directory: apps/api
        run: |
          python <<'PY'
          import xml.etree.ElementTree as ET
          root=ET.parse("postgres-results.xml").getroot()
          assert len(root.findall(".//testcase")) >= 10
          assert not root.findall(".//skipped"), "PostgreSQL tests must execute"
          PY

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: npm ci --prefix infrastructure/smoke
      - run: cd infrastructure/smoke && npx playwright install --with-deps chromium
      - run: docker build -f infrastructure/docker/web.Dockerfile -t dinner-swipe-web:ci .
      - run: docker run -d --name dinner-swipe-smoke --read-only --cap-drop ALL --security-opt no-new-privileges:true --tmpfs /tmp:size=64m -p 127.0.0.1:19233:8080 dinner-swipe-web:ci
      - run: npm test --prefix infrastructure/smoke
        env:
          SMOKE_ORIGIN: http://127.0.0.1:19233
